spring:
  application:
    name: myfschoolse1913-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/myfschoolse1913}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
  bootstrap:
    demo-user:
      enabled: ${SEED_DEMO_USER:false}
