spring:
  application:
    name: myfschoolse1913-backend

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myfschoolse1913}
    username: ${DB_USERNAME:northstar}
    password: ${DB_PASSWORD:northstar}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      # Assistant turns run on the request thread — bound the wait and retry
      # transient failures instead of hanging the SSE connection.
      timeout: 60s
      max-retries: 2
      chat:
        model: ${ASSISTANT_CHAT_MODEL:gpt-5.5}
      # Embedding config KEEPS the `.options` nesting (unlike chat above).
      # 3-large shortened to 1536 dims (Matryoshka): best multilingual quality
      # for Vietnamese documents at a pgvector-indexable width.
      embedding:
        options:
          model: text-embedding-3-large
          dimensions: 1536
    vectorstore:
      pgvector:
        # Flyway owns the schema (V15) — HNSW + cosine are the defaults.
        initialize-schema: false
        dimensions: 1536
    chat:
      memory:
        repository:
          jdbc:
            # Flyway owns the spring_ai_chat_memory schema (V13).
            initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
    password-reset-otp-ttl: ${PASSWORD_RESET_OTP_TTL:5m}
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:10m}
    password-reset-request-cooldown: ${PASSWORD_RESET_REQUEST_COOLDOWN:60s}
    password-reset-max-requests-per-hour: ${PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:5}
    password-reset-max-verify-attempts: ${PASSWORD_RESET_MAX_VERIFY_ATTEMPTS:5}
    expose-password-reset-otp: ${EXPOSE_PASSWORD_RESET_OTP:true}
  bootstrap:
    demo-user:
      enabled: ${SEED_DEMO_USER:false}
